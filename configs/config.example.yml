# Example configuration file for ApiaryCD
# Copy this to config.yaml and customize as needed

http:
  address: "127.0.0.1:3000"
  proxy_header: "X-Forwarded-For"
  proxies: []

storage:
  data_dir: "./data/db"

docker:
  host: "unix:///var/run/docker.sock"
  api_version: "1.43"
  timeout: "30s"
  tls_enabled: false

repositories:
  timeout: "30s"
  storage_dir: "./data/repos"
  default_auth:
    ssh:
      private_key_path: "~/.ssh/id_rsa"
    https:
      username: ""
      password: "" # Personal access token for GitHub/GitLab

example:
  example: "example"
